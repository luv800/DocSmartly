<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Register – DocSmartly</title>
<link rel="stylesheet" href="css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body { display: grid; place-items: center; min-height: 100vh; padding: 20px; background: var(--bg); }
.box-auth { background: #fff; border: 1px solid var(--ln); border-radius: 16px; padding: 32px; width: 100%; max-width: 440px; box-shadow: 0 10px 30px rgba(19,35,63,.08); }
.err-box { background: #fdecea; border: 1px solid #f3b8b2; color: #7a1a12; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="box-auth">
  <a href="index.html" style="font-weight:700;color:var(--ac);display:inline-block;margin-bottom:16px">← Home</a>
  <h1 style="font-size:1.8rem;margin-bottom:6px">Create account</h1>
  <p style="color:var(--mut);margin-bottom:20px;font-size:0.92rem">Join DocSmartly for instant PVC card printing</p>
  
  <div id="err" class="err-box" hidden></div>

  <form id="fReg">
    <div style="margin-bottom:12px">
      <label style="display:block;font-weight:700;font-size:.85rem;margin-bottom:4px">Full Name</label>
      <input id="rName" type="text" placeholder="Your name" required>
    </div>
    <div style="margin-bottom:12px">
      <label style="display:block;font-weight:700;font-size:.85rem;margin-bottom:4px">Mobile Number</label>
      <input id="rMob" type="tel" placeholder="10-digit mobile" required pattern="[0-9]{10}">
    </div>
    <div style="margin-bottom:12px">
      <label style="display:block;font-weight:700;font-size:.85rem;margin-bottom:4px">Email</label>
      <input id="rMail" type="email" placeholder="name@domain.com" required>
    </div>
    <div style="margin-bottom:18px">
      <label style="display:block;font-weight:700;font-size:.85rem;margin-bottom:4px">Password (min 8 chars)</label>
      <input id="rPw" type="password" required minlength="8">
    </div>
    <button class="btn" type="submit" style="width:100%">Create Account</button>
  </form>
  
  <p style="text-align:center;color:var(--mut);font-size:.9rem;margin-top:20px">
    Already registered? <a href="login.html" style="color:var(--ac);font-weight:700">Log in</a>
  </p>
</div>

<script>
const API = 'https://docsmartly-api.hm2351994.workers.dev';
function genSalt() {
  return [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
}
async function hash(pw, salt) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: 100000 }, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
}

document.getElementById('fReg').onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.hidden = true;

  const name = document.getElementById('rName').value.trim();
  const mob = document.getElementById('rMob').value.trim();
  const mail = document.getElementById('rMail').value.trim().toLowerCase();
  const pw = document.getElementById('rPw').value;

  try {
    const salt = genSalt();
    const pwHash = await hash(pw, salt);
    const ref = new URLSearchParams(location.search).get('ref') || localStorage.getItem('ds_ref') || '';

    const res = await fetch(API + '/api/register', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ user: { name, mob, mail, salt, hash: pwHash }, ref })
    });
    if (res.status === 409) throw new Error('Mobile number or email already registered.');
    if (!res.ok) throw new Error('Registration failed. Try again.');

    const j = await res.json();
    localStorage.setItem('ds_session', j.user.id);
    localStorage.setItem('ds_token', j.token);
    localStorage.setItem('ds_users', JSON.stringify([j.user]));

    window.location.replace('dashboard.html');
  } catch (ex) {
    err.textContent = ex.message || 'Registration failed.';
    err.hidden = false;
  }
};
</script>
</body>
</html>
