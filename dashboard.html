<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard – DocSmartly</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
if (!localStorage.getItem('ds_session') || !localStorage.getItem('ds_token')) {
  window.location.replace('login.html');
}
</script>
<style>
  :root {
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --bg: #f4f6fb;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;
    --success: #16a34a;
    --radius: 16px;
    --shadow: 0 8px 24px rgba(17, 24, 39, .06);
    --ink: #0f172a;
    --tint: #eff6ff;
    --ac: #2563eb;
    --ac2: #1d4ed8;
    --ln: #e5e7eb;
    --sf: #ffffff;
    --ok: #16a34a;
    --er: #dc2626;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
  }

  .layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    min-height: 100vh;
  }

  /* Sidebar */
  .sidebar {
    background: #0f172a;
    color: #e2e8f0;
    padding: 24px 16px;
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    z-index: 20;
    display: flex;
    flex-direction: column;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 20px;
    text-decoration: none;
  }

  .brand span {
    background: var(--primary);
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: grid;
    place-items: center;
    font-size: 18px;
  }

  .nav {
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
  }

  .nav a, .mi {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #cbd5e1;
    text-decoration: none;
    padding: 11px 14px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 600;
    transition: .2s;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    width: 100%;
  }

  .nav a:hover,
  .nav a.active, .mi:hover {
    background: rgba(37, 99, 235, .18);
    color: #fff;
  }

  .sidebar-footer {
    margin-top: auto;
    border-top: 1px solid rgba(255,255,255,.1);
    padding-top: 16px;
  }

  /* Main Area */
  main {
    padding: 28px;
    min-width: 0;
  }

  .topbar {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 22px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    box-shadow: var(--shadow);
    flex-wrap: wrap;
    margin-bottom: 24px;
  }

  .welcome h1 {
    font-size: 22px;
  }

  .welcome p {
    color: var(--muted);
    font-size: 14px;
    margin-top: 4px;
  }

  .top-actions {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .balance-pill {
    background: #eff6ff;
    color: var(--primary-dark);
    border: 1px solid #bfdbfe;
    padding: 10px 16px;
    border-radius: 999px;
    font-weight: 600;
    text-decoration: none;
    font-size: 14px;
  }

  .btn {
    border: none;
    cursor: pointer;
    padding: 11px 18px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 14px;
    transition: .2s;
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }

  .btn-primary {
    background: var(--primary);
    color: #fff;
  }

  .btn-primary:hover {
    background: var(--primary-dark);
  }

  .btn-light {
    background: #fff;
    border: 1px solid var(--border);
    color: var(--text);
  }

  .btn-light:hover {
    background: #f8fafc;
  }

  /* Stats Cards */
  .stats {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 18px;
    margin-bottom: 24px;
  }

  .stat {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    box-shadow: var(--shadow);
  }

  .stat-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .stat h3 {
    font-size: 14px;
    color: var(--muted);
    font-weight: 600;
  }

  .icon {
    width: 40px;
    height: 40px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    font-size: 16px;
  }

  .blue { background: #eff6ff; }
  .green { background: #ecfdf5; }
  .orange { background: #fff7ed; }
  .purple { background: #f5f3ff; }

  .stat-value {
    font-size: 24px;
    font-weight: 700;
    margin-top: 12px;
  }

  .stat-note {
    font-size: 13px;
    color: var(--muted);
    margin-top: 4px;
  }

  /* Tool & Service Cards Grid Styles */
  .ds { background: var(--sf); border: 1px solid var(--ln); border-radius: 14px; padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow); }
  .ds summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; cursor: pointer; font-weight: 700; color: var(--ink); font-size: 16px; }
  .ds summary em { font-style: normal; font-size: 0.8rem; background: var(--tint); color: var(--ac2); padding: 3px 12px; border-radius: 99px; }
  
  .ig { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 14px; margin-top: 14px; }
  .it { display: flex; flex-direction: column; justify-content: space-between; background: #fff; border: 1px solid var(--border); border-radius: 14px; padding: 14px; text-decoration: none; color: inherit; transition: transform .2s, border-color .2s, box-shadow .2s; }
  .it:hover { border-color: var(--ac); transform: translateY(-2px); box-shadow: 0 4px 14px rgba(36,87,214,.1); }
  
  .sv { position: relative; aspect-ratio: 16/10; border-radius: 10px; margin-bottom: 10px; overflow: hidden; background: radial-gradient(rgba(19,35,63,.08) 1px, transparent 1.5px) 0 0/12px 12px, linear-gradient(135deg, var(--t), #fff); }
  .art { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 4px 5px rgba(19,35,63,.22)); }
  .fa { fill: var(--a); } .fb { fill: var(--b); } .fw { fill: #fff; } .fl { fill: #dbe4f3; } .fk { fill: #13233f; } .fy { fill: #f5c451; } .fg { fill: #16a34a; } .fr { fill: #dc2626; } .fm { fill: #8a93a6; } .fo { fill: #fff; fill-opacity: .4; }
  .sa { fill: none; stroke: var(--a); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .sw { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  
  .badge-free { background: var(--ok); color: #fff; font-size: 0.72rem; padding: 3px 10px; border-radius: 99px; font-weight: 700; width: fit-content; margin-top: 8px; }
  .badge-paid { background: #fff1cc; color: #6b4200; font-size: 0.72rem; padding: 3px 10px; border-radius: 99px; font-weight: 700; border: 1px solid #f0cf7d; width: fit-content; margin-top: 8px; }

  .tools-dash-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 32px; margin-bottom: 16px; }
  .dash-search-bar { display: flex; gap: 8px; align-items: center; max-width: 380px; width: 100%; }
  .dash-search-bar input { height: 42px; width: 100%; padding: 8px 14px; font-size: 0.9rem; border: 1px solid var(--border); border-radius: 10px; outline: none; }
  .dash-search-bar input:focus { border-color: var(--primary); }
  
  .dash-cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 20px; }
  .dash-cats button { border: 1px solid var(--border); background: #fff; border-radius: 99px; padding: 7px 16px; font: 600 .85rem 'Plus Jakarta Sans',sans-serif; cursor: pointer; transition: all 0.2s; color: var(--muted); }
  .dash-cats button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

  /* Dropdown Sidebar Category styling */
  .sb-category { margin-top: 14px; border-top: 1px solid rgba(255,255,255,.1); padding-top: 14px; }
  .sb-group { margin-bottom: 6px; background: rgba(255,255,255,.02); border-radius: 8px; overflow: hidden; }
  .sb-group summary { display: flex; justify-content: space-between; align-items: center; padding: 9px 12px; font-size: 0.82rem; font-weight: 700; color: #cbd5e1; cursor: pointer; border-radius: 8px; list-style: none; }
  .sb-group summary:hover { background: rgba(255,255,255,.07); color: #fff; }
  .sb-group summary::-webkit-details-marker { display: none; }
  .sb-group summary em { font-style: normal; font-size: 0.7rem; background: rgba(37,99,235,.2); color: #60a5fa; padding: 2px 8px; border-radius: 99px; }
  .sb-sub-list { padding: 4px 6px 8px 10px; display: grid; gap: 2px; max-height: 220px; overflow-y: auto; }
  .sb-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; font-size: 0.78rem; font-weight: 500; color: #94a3b8; text-decoration: none; border-radius: 6px; cursor: pointer; border: none; background: none; width: 100%; text-align: left; transition: all 0.2s; }
  .sb-item:hover { color: #fff; background: rgba(37,99,235,.2); }
  .sb-ic { display: inline-flex; align-items: center; gap: 8px; }
  .sb-ic svg { width: 14px; height: 14px; color: #60a5fa; flex: none; }

  /* Tables */
  .tw { overflow-x: auto; background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th, td { padding: 14px 18px; text-align: left; border-bottom: 1px solid var(--border); font-size: 14px; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: #f8fafc; font-weight: 700; }
  
  .sb-status { display: inline-block; border-radius: 99px; padding: 4px 12px; font-size: 12px; font-weight: 700; text-transform: capitalize; }
  .s-pending { background: #fff7ed; color: #ea580c; }
  .s-processing { background: #dbe7ff; color: #1b44ad; }
  .s-success { background: #ecfdf5; color: #16a34a; }
  .s-failed { background: #fdecea; color: #7a1a12; }

  /* Panels / Container Views */
  .panel-view { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow); max-width: 500px; }
  .panel-view h1 { font-size: 20px; margin-bottom: 16px; }

  @media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .sidebar { position: relative; height: auto; }
  }
</style>
</head>

<div class="modal" id="rm" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:1000; align-items:center; justify-content:center; backdrop-filter:blur(4px);">
  <div class="box" style="background:#fff; width:100%; max-width:420px; border-radius:18px; padding:28px; box-shadow:0 10px 30px rgba(0,0,0,0.15); position:relative;">

</div>

<script>
const API = 'https://docsmartly-api.hm2351994.workers.dev';
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c));
const inr = n => '₹' + Number(n || 0).toLocaleString('en-IN');
const dt = t => t ? new Date(t).toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'}) : '-';
const tokenHdr = () => ({ 'x-user-token': localStorage.getItem('ds_token') || '' });
const api = (m, p, b) => fetch(API + p, { method: m, headers: { 'content-type': 'application/json', ...tokenHdr() }, body: b === undefined ? undefined : JSON.stringify(b) });

// Fallback helper in case tools.js doesn't define getToolUrl
if (typeof getToolUrl === 'undefined') {
  window.getToolUrl = function(name) {
    const slug = name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
    return 'freetools/' + slug + '.html';
  };
}

function user() {
  try {
    const list = JSON.parse(localStorage.getItem('ds_users') || '[]');
    const sess = localStorage.getItem('ds_session');
    const u = list.find(x => x.id === sess);
    return u || { name: 'User', bal: 0, orders: [], tx: [], code: '' };
  } catch (e) {
    return { name: 'User', bal: 0, orders: [], tx: [], code: '' };
  }
}
function saveUser(u) {
  const list = JSON.parse(localStorage.getItem('ds_users') || '[]');
  const idx = list.findIndex(x => x.id === u.id);
  if (idx >= 0) list[idx] = u; else list.push(u);
  localStorage.setItem('ds_users', JSON.stringify(list));
}
function updateBalance() {
  const u = user();
  const balancePill = document.getElementById('aB');
  if (balancePill) balancePill.textContent = 'Wallet: ' + inr(u.bal);
}

function getArtworkFor(item) {
  try {
    const n = item.n, sec = item.sec;
    if (V[n]) return V[n]();
    if (sec && V[sec]) return V[sec]();
    if (DA[n]) return DA[n]();
    if (TA[n]) return TA[n]();
  } catch(e) {}
  return PG();
}

const getThumbHtml=(item, idx)=>{
  try {
    return `<div class="sv" style="${sty(idx)}">${art(getArtworkFor(item))}</div>`;
  } catch(e) {
    return `<div class="sv" style="${sty(idx)}">${art(PG())}</div>`;
  }
};

    { n: "Meta Title & Description Generator", isPaid: false, ic: "globe" },
    { n: "OMR Sheet Generator & Checker", isPaid: false, ic: "doc" }
  ]
};

let curFilter = "All";

function setupSidebarCategories() {
  const mount = document.getElementById('sbCategories');
  if (!mount) return;
  mount.innerHTML = Object.entries(CATEGORIES).map(([catName, items], idx) => `
    <details class="sb-group" ${idx === 0 ? 'open' : ''}>
      <summary><span>${esc(catName)}</span><em>${items.length}</em></summary>
      <div class="sb-sub-list">
        ${items.map(it => {
          if (typeof paidToolsMap !== 'undefined' && paidToolsMap[it.n]) {
            return `<a href="${getToolUrl(it.n)}" class="sb-item">
              <span class="sb-ic">${getMiniSvg(it.ic)} ${esc(it.n)}</span>
              <span style="font-size:0.7rem;color:#f59e0b;font-weight:700">${inr(it.amt)}</span>
            </a>`;
          } else if (it.isPaid) {
            return `<button type="button" class="sb-item" data-svc="${esc(it.sec + '|' + it.n)}" data-amt="${it.amt}">
              <span class="sb-ic">${getMiniSvg(it.ic)} ${esc(it.n)}</span>
              <span style="font-size:0.7rem;color:#f59e0b;font-weight:700">${inr(it.amt)}</span>
            </button>`;
          } else {
            return `<a href="${getToolUrl(it.n)}" class="sb-item">
              <span class="sb-ic">${getMiniSvg(it.ic)} ${esc(it.n)}</span>
              <span style="font-size:0.7rem;color:#4ade80;font-weight:700">Free</span>
            </a>`;
          }
        }).join('')}
      </div>
    </details>
  `).join('');
}

function renderDashboardSections() {
  const q = (document.getElementById('dashToolQ')?.value || '').trim().toLowerCase();
  const mount = document.getElementById('bifurcatedSections');
  if (!mount) return;

  let html = '', globalIndex = 0;

  Object.entries(CATEGORIES).forEach(([catName, items]) => {
    if (curFilter === "Free Only" && catName.includes("(Paid)")) return;
    if (curFilter === "Paid Only" && catName.includes("(Free)")) return;
    if (curFilter !== "All" && curFilter !== "Free Only" && curFilter !== "Paid Only" && !catName.toLowerCase().includes(curFilter.toLowerCase())) return;

    const filteredItems = items.filter(t => !q || t.n.toLowerCase().includes(q) || (t.sec && t.sec.toLowerCase().includes(q)));
    if (!filteredItems.length) return;

    html += `
      <details class="ds" open>
        <summary><span>${esc(catName)}</span><em>${filteredItems.length}</em></summary>
        <div class="ig">
          ${filteredItems.map(it => {
            globalIndex++;
            if (typeof paidToolsMap !== 'undefined' && paidToolsMap[it.n]) {
              return `
                <a href="${getToolUrl(it.n)}" class="it">
                  ${getThumbHtml(it, globalIndex)}
                  <div style="flex:1">
                    <h3 style="font-size:0.9rem;margin:0">${esc(it.n)}</h3>
                    <p style="font-size:0.75rem;color:var(--muted);margin-top:2px">${esc(it.sec)}</p>
                  </div>
                  <div class="badge-paid">${inr(it.amt)}</div>
                </a>`;
            } else if (it.isPaid) {
              return `
                <div class="it" style="cursor:pointer" data-svc="${esc(it.sec + '|' + it.n)}" data-amt="${it.amt}">
                  ${getThumbHtml(it, globalIndex)}
                  <div style="flex:1">
                    <h3 style="font-size:0.9rem;margin:0">${esc(it.n)}</h3>
                    <p style="font-size:0.75rem;color:var(--muted);margin-top:2px">${esc(it.sec)}</p>
                  </div>
                  <div class="badge-paid">${inr(it.amt)}</div>
                </div>`;
            } else {
              return `
                <a href="${getToolUrl(it.n)}" class="it">
                  ${getThumbHtml(it, globalIndex)}
                  <div style="flex:1">
                    <h3 style="font-size:0.9rem;margin:0">${esc(it.n)}</h3>
                    <p style="font-size:0.75rem;color:var(--muted);margin-top:2px">${esc(catName.split(' ')[0])}</p>
                  </div>
                  <div class="badge-free">FREE</div>
                </a>`;
            }
          }).join('')}
        </div>
      </details>
    `;
  });

  mount.innerHTML = html || '<p style="color:var(--muted);font-size:0.9rem;padding:12px">No tools or services match your search.</p>';
}

function renderDashboard() {
  try {
    const u = user();
    const o = u.orders || [], cnt = s => o.filter(x => x.s === s).length;
    const cats = ["All", "Free Only", "Paid Only", "Vehicle", "Identity", "Tax", "Citizen", "Govt", "PDF", "Photo", "Print", "Documents", "Calculators"];

    const dashMount = document.querySelector('[data-v="dashboard"]');
    if (!dashMount) return;

    dashMount.innerHTML = `
      <section class="topbar">
        <div class="welcome">
          <h1>Welcome back 👋, ${esc(u.name)}</h1>
          <p>Manage your documents, requests and wallet from one place.</p>
        </div>

        <div class="top-actions">
          <a class="balance-pill" href="#passbook">Wallet: ${inr(u.bal)}</a>
          <a class="btn btn-primary" href="#addmoney">+ Add Balance</a>
        </div>
      </section>

      <section class="stats">
        <div class="stat">
          <div class="stat-head">
            <h3>Wallet Balance</h3>
            <div class="icon blue">💰</div>
          </div>
          <div class="stat-value">${inr(u.bal)}</div>
          <div class="stat-note">Available for services</div>
        </div>

        <div class="stat">
          <div class="stat-head">
            <h3>Total Requests</h3>
            <div class="icon purple">📄</div>
          </div>
          <div class="stat-value">${o.length}</div>
          <div class="stat-note">All service requests</div>
        </div>

        <div class="stat">
          <div class="stat-head">
            <h3>Pending</h3>
            <div class="icon orange">⏳</div>
          </div>
          <div class="stat-value">${cnt('pending')}</div>
          <div class="stat-note">Awaiting action</div>
        </div>

        <div class="stat">
          <div class="stat-head">
            <h3>Successful</h3>
            <div class="icon green">✅</div>
          </div>
          <div class="stat-value">${cnt('success')}</div>
          <div class="stat-note">Completed requests</div>
        </div>
      </section>

      <div class="tools-dash-head">
        <div>
          <h2 style="font-size:1.3rem;margin:0">Tools &amp; Services Portal</h2>
          <p style="color:var(--muted);font-size:0.85rem;margin-top:2px">All free browser tools and paid print services categorized</p>
        </div>
        <div class="dash-search-bar">
          <input id="dashToolQ" type="search" placeholder="Search by name (e.g. RC, PDF, PAN)..." aria-label="Search tools">
        </div>
      </div>
      
      <div class="dash-cats" id="dashCats">
        ${cats.map(c => `<button type="button" class="${c === curFilter ? 'on' : ''}" data-cat="${c}">${c}</button>`).join('')}
      </div>

      <div id="bifurcatedSections"></div>
    `;

    renderDashboardSections();

    const qInp = document.getElementById('dashToolQ');
    if (qInp) qInp.oninput = renderDashboardSections;

    const catsEl = document.getElementById('dashCats');
    if (catsEl) {
      catsEl.onclick = e => {
        const btn = e.target.closest('[data-cat]');
        if (!btn) return;
        curFilter = btn.dataset.cat;
        document.querySelectorAll('#dashCats button').forEach(b => b.classList.toggle('on', b.dataset.cat === curFilter));
        renderDashboardSections();
      };
    }
  } catch (err) {
    console.error("renderDashboard error:", err);
  }
}

function renderHistory() {
  const u = user(), o = (u.orders || []).slice().sort((a,b) => b.t - a.t);
  document.querySelector('[data-v="history"]').innerHTML = `
    <h1 style="margin-bottom:16px; font-size:22px;">Request History</h1>
    <div class="tw"><table><thead><tr><th>Date</th><th>Service</th><th>Status</th><th>Amount</th><th>File</th></tr></thead>
    <tbody>${o.map(x => `
      <tr>
        <td>${dt(x.t)}</td>
        <td><b>${esc(x.n)}</b>${x.remark ? `<br><small style="color:var(--muted)">Remark: ${esc(x.remark)}</small>` : ''}</td>
        <td><span class="sb-status s-${esc(x.s)}">${esc(x.s)}</span></td>
        <td>${inr(x.amt)}</td>
        <td>${x.file ? `<button class="btn btn-light" data-dl="${esc(x.id)}" data-fn="${esc(x.file.name)}" style="padding:4px 10px;min-height:32px;font-size:.8rem">Download</button>` : '<span style="color:var(--muted)">In progress</span>'}</td>
      </tr>
    `).join('') || '<tr><td colspan="5" style="text-align:center">No requests yet.</td></tr>'}</tbody></table></div>
  `;
}

function renderPassbook() {
  const u = user(), tx = (u.tx || []).slice().sort((a,b) => b.t - a.t);
  document.querySelector('[data-v="passbook"]').innerHTML = `
    <h1 style="margin-bottom:16px; font-size:22px;">Passbook Transactions</h1>
    <div class="tw"><table><thead><tr><th>Date</th><th>Note</th><th>Type</th><th>Amount</th></tr></thead>
    <tbody>${tx.map(t => `
      <tr><td>${dt(t.t)}</td><td>${esc(t.note)}</td><td><b>${t.type}</b></td><td><b>${t.type==='credit'?'+':'-'}${inr(t.amt)}</b></td></tr>
    `).join('') || '<tr><td colspan="4" style="text-align:center">No transactions yet.</td></tr>'}</tbody></table></div>
  `;
}

function renderAddMoney() {
  const u = user();
  document.querySelector('[data-v="addmoney"]').innerHTML = `
    <div class="panel-view">
      <h1>Add Money to Wallet</h1>
      <p style="margin-bottom:14px; color:var(--muted)">Current Balance: <b>${inr(u.bal)}</b></p>
      <form id="fAdd">
        <label style="display:block;font-weight:700;margin-bottom:6px;font-size:14px">Amount (Min ₹200)</label>
        <input id="amt" type="number" min="200" value="500" required style="width:100%; height:42px; padding:8px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:16px; outline:none;">
        <button class="btn btn-primary" type="submit" style="width:100%">Pay via UPI</button>
      </form>
    </div>
  `;
}

function renderReferral() {
  const u = user();
  const link = location.origin + '/register.html?ref=' + (u.code || '');
  document.querySelector('[data-v="referral"]').innerHTML = `
    <div class="panel-view">
      <h1>Refer &amp; Earn</h1>
      <p style="margin-bottom:14px; color:var(--muted)">Share your referral link. Earn ₹10 wallet bonus on friend's first recharge.</p>
      <input readonly value="${esc(link)}" style="width:100%; height:42px; padding:8px 12px; border:1px solid var(--border); border-radius:10px; margin-bottom:14px; background:#f8fafc;" />
      <button class="btn btn-primary" onclick="navigator.clipboard.writeText('${esc(link)}');alert('Link copied!')" style="width:100%">Copy Link</button>
    </div>
  `;
}

function renderProfile() {
  const u = user();
  document.querySelector('[data-v="profile"]').innerHTML = `
    <div class="panel-view">
      <h1>My Profile</h1>
      <div style="display:grid; gap:10px; font-size:15px;">
        <p><b>Name:</b> ${esc(u.name)}</p>
        <p><b>Mobile:</b> ${esc(u.mob)}</p>
        <p><b>Email:</b> ${esc(u.mail)}</p>
        <p><b>Referral Code:</b> ${esc(u.code || '-')}</p>
      </div>
    </div>
  `;
}

function renderContact() {
  document.querySelector('[data-v="contact"]').innerHTML = `
    <div class="panel-view">
      <h1>Contact Support</h1>
      <p style="margin-bottom:16px; color:var(--muted)">Need help with an order, wallet balance, or custom requirement?</p>
      <a class="btn btn-primary" href="https://wa.me/917300277557?text=Hello%20DocSmartly%20Support" target="_blank" style="width:100%">Chat on WhatsApp</a>
    </div>
  `;
}

const VIEWS = { dashboard: renderDashboard, history: renderHistory, passbook: renderPassbook, addmoney: renderAddMoney, referral: renderReferral, profile: renderProfile, contact: renderContact };

function route() {
  try {
    const h = location.hash.slice(1) || 'dashboard';
    document.querySelectorAll('[data-v]').forEach(el => el.hidden = el.dataset.v !== h);
    if (VIEWS[h]) VIEWS[h]();
    updateBalance();

    document.querySelectorAll('.nav a').forEach(a => {
      a.classList.toggle('active', a.getAttribute('href') === '#' + h);
    });
  } catch (err) {
    console.error("Route execution error:", err);
  }
}
window.addEventListener('hashchange', route);

let curKey = '', curAmt = 0;
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-svc]');
  if (!btn) return;
  curKey = btn.dataset.svc;
  curAmt = Number(btn.dataset.amt);
  const u = user();
  const serviceName = curKey.split('|')[1] || curKey;
  
  document.getElementById('rt').textContent = serviceName;
  document.getElementById('rp').innerHTML = `Is service ke liye aapke wallet balance se <b style="color:var(--ac); font-size:1.05rem;">${inr(curAmt)}</b> kate jayenge.<br><small style="color:var(--muted);">Current Balance: ${inr(u.bal)}</small>`;
  
  document.getElementById('fRq').innerHTML = `
    <div style="margin-bottom:12px">
      <label style="display:block;font-weight:700;font-size:.85rem;margin-bottom:4px">Vehicle / Document / Application Number</label>
      <input id="rqDoc" type="text" required placeholder="Enter number" style="width:100%; height:42px; padding:8px 12px; border:1px solid var(--border); border-radius:8px; box-sizing:border-box;">
    </div>
    <div style="margin-bottom:16px">
      <label style="display:block;font-weight:700;font-size:.85rem;margin-bottom:4px">Remarks (optional)</label>
      <input id="rqRem" type="text" placeholder="Special instruction" style="width:100%; height:42px; padding:8px 12px; border:1px solid var(--border); border-radius:8px; box-sizing:border-box;">
    </div>
    <div style="display:flex; gap:10px;">
      <button type="button" id="btnCancelModal" style="flex:1; height:42px; border:1px solid var(--border); background:#fff; font-weight:700; border-radius:8px; cursor:pointer;">Cancel</button>
      <button class="btn btn-primary" type="submit" style="flex:1; height:42px;">Confirm &amp; Proceed</button>
    </div>
  `;
  document.getElementById('rm').style.display = 'flex';
});

document.getElementById('rx').onclick = () => document.getElementById('rm').style.display = 'none';
document.addEventListener('click', e => {
  if (e.target.id === 'btnCancelModal') document.getElementById('rm').style.display = 'none';
});

document.getElementById('fRq').onsubmit = async e => {
  e.preventDefault();
  const doc = document.getElementById('rqDoc').value.trim();
  const rem = document.getElementById('rqRem').value.trim();
  const u = user();
  if (u.bal < curAmt) {
    alert('Insufficient balance. Please add money first.');
    location.hash = '#addmoney';
    document.getElementById('rm').style.display = 'none';
    return;
  }
  const res = await api('POST', '/api/requests', {
    k: curKey, sec: curKey.split('|')[0], doc: doc, amt: curAmt, data: { 'Document Number': doc, 'Remarks': rem }
  });
  if (!res.ok) { alert('Failed to submit request.'); return; }
  const j = await res.json();
  saveUser(j.user);
  document.getElementById('rm').style.display = 'none';
  alert('Request submitted successfully!');
  route();
};

document.addEventListener('submit', async e => {
  if (e.target.id !== 'fAdd') return;
  e.preventDefault();
  const amt = Number(document.getElementById('amt').value);
  const res = await api('POST', '/api/topup', { amt });
  if (res.ok) {
    const j = await res.json();
    saveUser(j.user);
    alert('Wallet recharged: ' + inr(amt));
    location.hash = '#dashboard';
    route();
  }
});

document.addEventListener('click', async e => {
  const dl = e.target.closest('[data-dl]');
  if (!dl) return;
  const r = await fetch(API + '/api/requests/' + encodeURIComponent(dl.dataset.dl) + '/file', { headers: tokenHdr() });
  if (!r.ok) { alert('File not available.'); return; }
  const b = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = dl.dataset.fn || 'result.pdf'; a.click();
});

function logout() {
  localStorage.removeItem('ds_session');
  localStorage.removeItem('ds_token');
  window.location.replace('index.html');
}
document.getElementById('btnLogOut').onclick = logout;
document.getElementById('loSb').onclick = logout;

try {
  setupSidebarCategories();
} catch (e) {
  console.error("Sidebar setup error:", e);
}
route();
</script>
</body>
</html>
