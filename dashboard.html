<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard – DocSmartly</title>
<link rel="stylesheet" href="css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
if (!localStorage.getItem('ds_session') || !localStorage.getItem('ds_token')) {

<style>
#app { min-height: 100vh; background: var(--bg); }
.ap { position: sticky; top: 0; z-index: 20; background: rgba(245,248,255,.96); backdrop-filter: blur(8px); border-bottom: 1px solid var(--ln); }
.ap > .w { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding-block: 8px; min-height: 60px; max-width: 1400px; }
.tb { display: flex; align-items: center; gap: 8px; margin-left: auto; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 99px; background: var(--tint); border: 1.5px solid var(--ln); font-size: .92rem; font-weight: 700; color: var(--ac2); text-decoration: none; }
.shell { display: grid; grid-template-columns: 290px minmax(0,1fr); max-width: 1400px; margin: 0 auto; }
.apm { padding-inline: 24px; padding-block: 28px 64px; min-width: 0; }
#sb { position: sticky; top: 61px; height: calc(100vh - 61px); display: flex; flex-direction: column; background: #fff; border-right: 1px solid var(--ln); z-index: 6; }
.sbs { flex: 1; overflow-y: auto; padding: 12px; }
.sbf { padding: 12px; border-top: 1px solid var(--ln); }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 42px; padding: 8px 12px; border: 0; background: none; border-radius: 10px; font: 600 .92rem 'Plus Jakarta Sans',system-ui,sans-serif; color: var(--ink); cursor: pointer; text-align: left; text-decoration: none; }
.mi:hover { background: var(--tint); color: var(--ac); }
.gc { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: center; background: var(--ink); color: #e3ebfb; border-radius: 18px; padding: 24px; }
.gc h1 { color: #fff; }
.gw { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.gw b { font: 800 1.8rem 'Plus Jakarta Sans',system-ui,sans-serif; color: #fff; }
.stt { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; margin-top: 16px; }
.stt > div { background: var(--sf); border: 1px solid var(--ln); border-radius: 14px; padding: 14px 16px; }
.stt b { font: 800 1.6rem 'Plus Jakarta Sans',system-ui,sans-serif; color: var(--ac2); display: block; }

.ds { background: var(--sf); border: 1px solid var(--ln); border-radius: 14px; padding: 4px 16px; margin-bottom: 14px; }
.ds summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 48px; cursor: pointer; font-weight: 700; color: var(--ink); }
.ds summary em { font-style: normal; font-size: 0.8rem; background: var(--tint); color: var(--ac2); padding: 2px 10px; border-radius: 99px; }
.ig { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding-bottom: 14px; }
.it { display: flex; flex-direction: column; justify-content: space-between; background: var(--sf); border: 1px solid var(--ln); border-radius: 12px; padding: 12px; text-decoration: none; color: inherit; transition: transform .2s, border-color .2s; }
.it:hover { border-color: var(--ac); transform: translateY(-2px); box-shadow: 0 4px 14px rgba(36,87,214,.1); }

/* Exact Homepage SVG Thumbnail Canvas */
.sv { position: relative; aspect-ratio: 16/10; border-radius: 9px; margin-bottom: 8px; overflow: hidden; background: radial-gradient(rgba(19,35,63,.08) 1px, transparent 1.5px) 0 0/12px 12px, linear-gradient(135deg, var(--t), #fff); }
.art { position: absolute; inset: 0; width: 100%; height: 100%; filter: drop-shadow(0 4px 5px rgba(19,35,63,.22)); }
.fa { fill: var(--a); } .fb { fill: var(--b); } .fw { fill: #fff; } .fl { fill: #dbe4f3; } .fk { fill: #13233f; } .fy { fill: #f5c451; } .fg { fill: #16a34a; } .fr { fill: #dc2626; } .fm { fill: #8a93a6; } .fo { fill: #fff; fill-opacity: .4; }
.sa { fill: none; stroke: var(--a); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.sw { fill: none; stroke: #fff; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }

/* Badges */
.badge-free { background: var(--ok); color: #fff; font-size: 0.72rem; padding: 2px 8px; border-radius: 99px; font-weight: 700; width: fit-content; margin-top: 8px; }
.badge-paid { background: #fff1cc; color: #6b4200; font-size: 0.72rem; padding: 2px 8px; border-radius: 99px; font-weight: 700; border: 1px solid #f0cf7d; width: fit-content; margin-top: 8px; }

/* Search & Filters */
.tools-dash-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 32px; margin-bottom: 14px; }
.dash-search-bar { display: flex; gap: 8px; align-items: center; max-width: 380px; width: 100%; }
.dash-search-bar input { height: 40px; min-height: 40px; padding: 6px 12px; font-size: 0.88rem; }
.dash-cats { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
.dash-cats button { border: 1px solid var(--ln); background: #fff; border-radius: 99px; padding: 6px 14px; font: 600 .8rem 'Plus Jakarta Sans',sans-serif; cursor: pointer; }
.dash-cats button.on { background: var(--ink); color: #fff; border-color: var(--ink); }

/* Left Sidebar Accordions */
.sb-category { margin-top: 10px; border-top: 1px solid var(--ln); padding-top: 10px; }
.sb-group { margin-bottom: 4px; }
.sb-group summary { display: flex; justify-content: space-between; align-items: center; padding: 8px 10px; font-size: 0.84rem; font-weight: 700; color: var(--ink); cursor: pointer; border-radius: 8px; list-style: none; }
.sb-group summary:hover { background: var(--tint); }
.sb-group summary::-webkit-details-marker { display: none; }
.sb-group summary em { font-style: normal; font-size: 0.72rem; color: var(--mut); }
.sb-sub-list { padding-left: 6px; margin-top: 4px; display: grid; gap: 2px; }
.sb-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; font-size: 0.8rem; font-weight: 500; color: var(--mut); text-decoration: none; border-radius: 6px; cursor: pointer; border: none; background: none; width: 100%; text-align: left; }
.sb-item:hover { color: var(--ac); background: var(--tint); }
.sb-ic { display: inline-flex; align-items: center; gap: 8px; }
.sb-ic svg { width: 15px; height: 15px; color: var(--ac); flex: none; }

.tw { overflow-x: auto; background: var(--sf); border: 1px solid var(--ln); border-radius: 14px; }
table { width: 100%; border-collapse: collapse; min-width: 520px; }
th, td { padding: 11px 18px; text-align: left; border-bottom: 1px solid var(--ln); font-size: .92rem; }
th { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--mut); background: var(--tint); }
.sb-status { display: inline-block; border-radius: 99px; padding: 3px 11px; font-size: .76rem; font-weight: 800; text-transform: capitalize; }
.s-pending { background: #fff1cc; color: #6b4200; }
.s-processing { background: #dbe7ff; color: #1b44ad; }
.s-success { background: #e0f5ea; color: #0f6b45; }
.s-failed { background: #fdecea; color: #7a1a12; }

@media (max-width: 900px) { .shell { display: block; } #sb { display: none; } }
</style>
</head>

function user() {
  try {
    const list = JSON.parse(localStorage.getItem('ds_users') || '[]');
    const sess = localStorage.getItem('ds_session');
    const u = list.find(x => x.id === sess);
    return u || { name: 'User', bal: 0, orders: [], tx: [], code: '' };
  } catch (e) {
    return { name: 'User', bal: 0, orders: [], tx: [], code: '' };
  }
}
function saveUser(u) {
  const list = JSON.parse(localStorage.getItem('ds_users') || '[]');
  const idx = list.findIndex(x => x.id === u.id);
  if (idx >= 0) list[idx] = u; else list.push(u);
  localStorage.setItem('ds_users', JSON.stringify(list));
}
function updateBalance() {
  const u = user();

function getArtworkFor(item) {
  try {
    const n = item.n, sec = item.sec;
    if (V[n]) return V[n]();
    if (sec && V[sec]) return V[sec]();
    if (DA[n]) return DA[n]();
    if (TA[n]) return TA[n]();
    const lower = String(n).toLowerCase();
    if (lower.includes("rc")) return V["RC Services"]();
    if (lower.includes("dl") || lower.includes("licence")) return V["DL Services"]();
    if (lower.includes("voter")) return V["Voter Services"]();
    if (lower.includes("farmer") || lower.includes("kisan")) return V["Farmer Services"]();
    if (lower.includes("pan")) return V["PAN Services"]();
    if (lower.includes("gst")) return V["GST Services"]();
    if (lower.includes("calc")) return CALC('18%');
    if (lower.includes("photo") || lower.includes("image") || lower.includes("jpg") || lower.includes("png")) return IMG(24,16,112,68);
    if (lower.includes("pdf")) return PDF(44,8,72,84);
  } catch(e) {}
  return PG();
}

const getThumbHtml=(item, idx)=>{
  try {
    return `<div class="sv" style="${sty(idx)}">${art(getArtworkFor(item))}</div>`;
  } catch(e) {
    return `<div class="sv" style="${sty(idx)}">${art(PG())}</div>`;
  }
};

let curFilter = "All";

function setupSidebarCategories() {
  const mount = document.getElementById('sbCategories');
  if (!mount) return;
  mount.innerHTML = Object.entries(CATEGORIES).map(([catName, items], idx) => `
    <details class="sb-group" ${idx < 2 ? 'open' : ''}>
      <summary><span>${esc(catName)}</span><em>${items.length}</em></summary>
      <div class="sb-sub-list">
        ${items.map(it => {
          if (it.isPaid) {
            return `<button type="button" class="sb-item" data-svc="${esc(it.sec + '|' + it.n)}" data-amt="${it.amt}">
              <span class="sb-ic">${getMiniSvg(it.ic)} ${esc(it.n)}</span>
              <span style="font-size:0.72rem;color:#b45309;font-weight:700">${inr(it.amt)}</span>
            </button>`;
          } else {
            return `<a href="${getToolUrl(it.n)}" class="sb-item">
              <span class="sb-ic">${getMiniSvg(it.ic)} ${esc(it.n)}</span>
              <span style="font-size:0.72rem;color:var(--ok);font-weight:700">Free</span>
            </a>`;
          }
        }).join('')}
      </div>
    </details>
  `).join('');
}

function renderDashboardSections() {
  const q = (document.getElementById('dashToolQ')?.value || '').trim().toLowerCase();
  const mount = document.getElementById('bifurcatedSections');
  if (!mount) return;

  let html = '', globalIndex = 0;

  Object.entries(CATEGORIES).forEach(([catName, items]) => {
    if (curFilter === "Free Only" && catName.includes("(Paid)")) return;
    if (curFilter === "Paid Only" && catName.includes("(Free)")) return;
    if (curFilter !== "All" && curFilter !== "Free Only" && curFilter !== "Paid Only" && !catName.toLowerCase().includes(curFilter.toLowerCase())) return;

    const filteredItems = items.filter(t => !q || t.n.toLowerCase().includes(q) || (t.sec && t.sec.toLowerCase().includes(q)));
    if (!filteredItems.length) return;

    html += `
      <details class="ds" open>
        <summary><span>${esc(catName)}</span><em>${filteredItems.length}</em></summary>
        <div class="ig">
          ${filteredItems.map(it => {
            globalIndex++;
            if (it.isPaid) {
              return `
                <div class="it" style="cursor:pointer" data-svc="${esc(it.sec + '|' + it.n)}" data-amt="${it.amt}">
                  ${getThumbHtml(it, globalIndex)}
                  <div style="flex:1">
                    <h3 style="font-size:0.92rem;margin:0">${esc(it.n)}</h3>
                    <p style="font-size:0.78rem;color:var(--mut);margin-top:2px">${esc(it.sec)}</p>
                  </div>
                  <div class="badge-paid">${inr(it.amt)}</div>
                </div>`;
            } else {
              return `
                <a href="${getToolUrl(it.n)}" class="it">
                  ${getThumbHtml(it, globalIndex)}
                  <div style="flex:1">
                    <h3 style="font-size:0.92rem;margin:0">${esc(it.n)}</h3>
                    <p style="font-size:0.78rem;color:var(--mut);margin-top:2px">${esc(catName.split(' ')[0])}</p>
                  </div>
                  <div class="badge-free">FREE</div>
                </a>`;
            }
          }).join('')}
        </div>
      </details>
    `;
  });

  mount.innerHTML = html || '<p style="color:var(--mut);font-size:0.9rem;padding:12px">No tools or services match your search.</p>';
}

function route() {

    document.querySelectorAll('[data-v]').forEach(el => el.hidden = el.dataset.v !== h);
    if (VIEWS[h]) VIEWS[h]();
    updateBalance();
  } catch (err) {
    console.error("Route execution error:", err);
  }
}

// Order Request Modal logic for Paid services
let curKey = '', curAmt = 0;
document.addEventListener('click', e => {
  const btn = e.target.closest('[data-svc]');
  if (!btn) return;
  curKey = btn.dataset.svc;
  curAmt = Number(btn.dataset.amt);
  const u = user();
  document.getElementById('rt').textContent = curKey.split('|')[1] || curKey;
  document.getElementById('rp').textContent = 'Charge: ' + inr(curAmt) + ' | Wallet Balance: ' + inr(u.bal);
  document.getElementById('fRq').innerHTML = `
    <div style="margin-bottom:12px">
      <label style="display:block;font-weight:700;font-size:.85rem;margin-bottom:4px">Vehicle / Document / Application Number</label>
      <input id="rqDoc" type="text" required placeholder="Enter number">
    </div>
    <div style="margin-bottom:16px">
      <label style="display:block;font-weight:700;font-size:.85rem;margin-bottom:4px">Remarks (optional)</label>
      <input id="rqRem" type="text" placeholder="Special instruction">
    </div>
    <button class="btn" type="submit" style="width:100%">Confirm & Deduct ${inr(curAmt)}</button>
  `;
  document.getElementById('rm').classList.add('open');
});

document.getElementById('rx').onclick = () => document.getElementById('rm').classList.remove('open');

document.getElementById('fRq').onsubmit = async e => {
  e.preventDefault();
  const doc = document.getElementById('rqDoc').value.trim();
  const rem = document.getElementById('rqRem').value.trim();
  const u = user();
  if (u.bal < curAmt) {
    alert('Insufficient balance. Please add money first.');
    location.hash = '#addmoney';
    document.getElementById('rm').classList.remove('open');
    return;
  }
  const res = await api('POST', '/api/requests', {
    k: curKey, sec: curKey.split('|')[0], data: { 'Document Number': doc, 'Remarks': rem }
  });
  if (!res.ok) { alert('Failed to submit request.'); return; }
  const j = await res.json();
  saveUser(j.user);
  document.getElementById('rm').classList.remove('open');
  alert('Request submitted successfully!');
  route();
};

document.addEventListener('submit', async e => {
  if (e.target.id !== 'fAdd') return;
  e.preventDefault();
  const amt = Number(document.getElementById('amt').value);
  const res = await api('POST', '/api/topup', { amt });
  if (res.ok) {
    const j = await res.json();
    saveUser(j.user);
    alert('Wallet recharged: ' + inr(amt));
    location.hash = '#dashboard';
    route();
  }
});

document.addEventListener('click', async e => {
  const dl = e.target.closest('[data-dl]');
  if (!dl) return;
  const r = await fetch(API + '/api/requests/' + encodeURIComponent(dl.dataset.dl) + '/file', { headers: tokenHdr() });
  if (!r.ok) { alert('File not available.'); return; }
  const b = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = dl.dataset.fn || 'result.pdf'; a.click();
});
