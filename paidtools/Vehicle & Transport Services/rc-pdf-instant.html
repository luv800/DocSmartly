<script>
const API = 'https://docsmartly-api.hm2351994.workers.dev';
const CHARGE = 40;
let currentRequestId = localStorage.getItem('ds_current_rc_req') || null;
let pollTimer = null;

function user() {
  try {
    const list = JSON.parse(localStorage.getItem('ds_users') || '[]');
    const sess = localStorage.getItem('ds_session');
    return list.find(x => x.id === sess) || { name: 'User', bal: 0, orders: [], tx: [] };
  } catch (e) {
    return { name: 'User', bal: 0, orders: [], tx: [] };
  }
}

function saveUser(u) {
  const list = JSON.parse(localStorage.getItem('ds_users') || '[]');
  const idx = list.findIndex(x => x.id === u.id);
  if (idx >= 0) list[idx] = u; else list.push(u);
  localStorage.setItem('ds_users', JSON.stringify(list));
}

function updateWalletUI() {
  const u = user();
  document.getElementById('walletBal').textContent = '₹' + Number(u.bal || 0).toLocaleString('en-IN');
}

function renderHistoryTable() {
  const u = user();
  const rcOrders = (u.orders || []).filter(o => o.n === 'RC PDF INSTANT').sort((a,b) => b.t - a.t);
  const tbody = document.getElementById('historyTbody');
  
  if (!rcOrders.length) {
    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--mut); padding: 24px;">No requests yet</td></tr>';
    return;
  }

  tbody.innerHTML = rcOrders.map(o => `
    <tr>
      <td>${new Date(o.t).toLocaleDateString('en-IN', {day:'2-digit',month:'short',year:'numeric'})}</td>
      <td><b>${o.doc || o.id}</b></td>
      <td><span class="sb-status s-${o.s}">${o.s}</span></td>
      <td>
        ${o.file ? `<button class="btn-primary" onclick="downloadFile('${o.id}', '${o.file.name}')" style="height:32px;padding:0 12px;font-size:0.8rem;background:var(--ok)">Download</button>` : '<span style="color:var(--mut);font-size:0.8rem;">In Progress</span>'}
      </td>
    </tr>
  `).join('');
}

// Step 1: Submit Form & Send to Backend API
document.getElementById('fRcForm').onsubmit = async function(e) {
  e.preventDefault();
  const u = user();
  
  if (u.bal < CHARGE) {
    alert('Insufficient balance! Kripya pehle wallet top-up karein.');
    window.location.href = '/dashboard.html#addmoney';
    return;
  }

  const vNo = document.getElementById('vNo').value.trim().toUpperCase();
  const chNo = document.getElementById('chNo').value.trim().toUpperCase();
  const engNo = document.getElementById('engNo').value.trim().toUpperCase();
  const mobNo = document.getElementById('mobNo').value.trim();
  const regAddr = document.getElementById('regAddr').value.trim();

  try {
    const res = await fetch(API + '/api/requests', {
      method: 'POST',
      headers: {
        'content-type': 'application/json',
        'x-user-token': localStorage.getItem('ds_token') || ''
      },
      body: JSON.stringify({
        k: 'RC Services|RC PDF INSTANT',
        sec: 'RC Services',
        amt: CHARGE,
        data: {
          'Vehicle Number': vNo,
          'Chassis Number': chNo,
          'Engine Number': engNo,
          'Mobile Number': mobNo,
          'Registered Address': regAddr,
          'otp_status': 'pending'
        }
      })
    });

    if (!res.ok) {
      alert('Failed to submit request to server.');
      return;
    }

    const j = await res.json();
    if (j.user) saveUser(j.user);
    
    // Save request ID securely in variable and localStorage
    currentRequestId = j.request ? j.request.id : ('RC_' + Date.now());
    localStorage.setItem('ds_current_rc_req', currentRequestId);

    updateWalletUI();
    renderHistoryTable();

    // Move to Step 2 (OTP Screen)
    document.getElementById('step1Form').style.display = 'none';
    document.getElementById('step2Otp').style.display = 'block';

  } catch (err) {
    console.error('Error:', err);
    alert('Network error while submitting request.');
  }
};

// Step 2: Submit OTP (Fixed with proper ID check and data merging)
document.getElementById('fOtpForm').onsubmit = async function(e) {
  e.preventDefault();
  const otp = document.getElementById('otpCode').value.trim();
  if (!otp) return;

  if (!currentRequestId) {
    currentRequestId = localStorage.getItem('ds_current_rc_req');
  }

  if (!currentRequestId) {
    alert('Session expired or Request ID missing. Kripya form dobara bharein.');
    location.reload();
    return;
  }

  try {
    const getRes = await fetch(API + '/api/requests/' + encodeURIComponent(currentRequestId), {
      headers: { 'x-user-token': localStorage.getItem('ds_token') || '' }
    });
    
    let existingData = {};
    if (getRes.ok) {
      const resJson = await getRes.json();
      if (resJson.request && resJson.request.data) {
        existingData = resJson.request.data;
      }
    }

    await fetch(API + '/api/requests/' + encodeURIComponent(currentRequestId), {
      method: 'PATCH',
      headers: {
        'content-type': 'application/json',
        'x-user-token': localStorage.getItem('ds_token') || ''
      },
      body: JSON.stringify({
        data: {
          ...existingData,
          entered_otp: otp,
          otp_status: 'waiting_verify'
        }
      })
    });
  } catch (err) {
    console.error('OTP Submit Error:', err);
  }

  document.getElementById('step2Otp').style.display = 'none';
  document.getElementById('step3Waiting').style.display = 'block';
  document.getElementById('waitTitle').textContent = 'Checking OTP confirmation...';
  document.getElementById('waitMsg').textContent = 'Admin dwara OTP verify kiya ja raha hai. Kripya pratiksha karein.';

  startStatusPolling();
};

function startStatusPolling() {
  if (pollTimer) clearInterval(pollTimer);
  
  pollTimer = setInterval(async () => {
    if (!currentRequestId) currentRequestId = localStorage.getItem('ds_current_rc_req');
    if (!currentRequestId) return;

    try {
      const r = await fetch(API + '/api/requests/' + encodeURIComponent(currentRequestId), {
        headers: { 'x-user-token': localStorage.getItem('ds_token') || '' }
      });
      if (!r.ok) return;
      const data = await r.json();
      const req = data.request;

      if (!req) return;

      if (req.data && req.data.otp_status === 'wrong') {
        clearInterval(pollTimer);
        alert('❌ Admin ne OTP galat paya hai! Kripya sahi OTP dobara enter karein.');
        document.getElementById('step3Waiting').style.display = 'none';
        document.getElementById('step2Otp').style.display = 'block';
        document.getElementById('otpCode').value = '';
        return;
      }

      if (req.s === 'success' && req.file) {
        clearInterval(pollTimer);
        localStorage.removeItem('ds_current_rc_req');
        document.getElementById('waitSpinner').style.display = 'none';
        document.getElementById('waitTitle').textContent = '✅ RC PDF Ready for Download!';
        document.getElementById('waitTitle').style.color = 'var(--ok)';
        document.getElementById('waitMsg').textContent = 'OTP verified & official RC PDF uploaded by Admin. Aap niche button par click karke download kar sakte hain.';
        
        const btnDl = document.getElementById('btnDownloadPdf');
        btnDl.onclick = () => downloadFile(req.id, req.file.name);
        document.getElementById('downloadContainer').style.display = 'block';
        
        renderHistoryTable();
      }
    } catch (e) {
      console.error('Polling error:', e);
    }
  }, 3000);
}

async function downloadFile(reqId, fileName) {
  try {
    const r = await fetch(API + '/api/requests/' + encodeURIComponent(reqId) + '/file', {
      headers: { 'x-user-token': localStorage.getItem('ds_token') || '' }
    });
    if (!r.ok) {
      alert('File download failed.');
      return;
    }
    const b = await r.blob();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = fileName || 'RC_Document.pdf';
    a.click();
  } catch (err) {
    alert('Downloading PDF...');
  }
}

updateWalletUI();
renderHistoryTable();
</script>
