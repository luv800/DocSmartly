<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Login – DocSmartly</title>
<link rel="stylesheet" href="css/styles.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body { display: grid; place-items: center; min-height: 100vh; padding: 20px; background: var(--bg); }
.box-auth { background: #fff; border: 1px solid var(--ln); border-radius: 16px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 10px 30px rgba(19,35,63,.08); }
.err-box { background: #fdecea; border: 1px solid #f3b8b2; color: #7a1a12; padding: 10px 14px; border-radius: 8px; font-size: 0.88rem; margin-bottom: 16px; }
</style>
</head>
<body>
<div class="box-auth">
  <a href="index.html" style="font-weight:700;color:var(--ac);display:inline-block;margin-bottom:16px">← Home</a>
  <h1 style="font-size:1.8rem;margin-bottom:6px">Log in</h1>
  <p style="color:var(--mut);margin-bottom:20px;font-size:0.92rem">Access your DocSmartly dashboard & wallet</p>
  
  <div id="err" class="err-box" hidden></div>

  <form id="fLog">
    <div style="margin-bottom:14px">
      <label style="display:block;font-weight:700;font-size:.85rem;margin-bottom:6px">Mobile or Email</label>
      <input id="lId" type="text" placeholder="9876543210 or email@domain.com" required>
    </div>
    <div style="margin-bottom:18px">
      <label style="display:block;font-weight:700;font-size:.85rem;margin-bottom:6px">Password</label>
      <input id="lPw" type="password" required>
    </div>
    <button class="btn" type="submit" style="width:100%">Log in to Dashboard</button>
  </form>
  
  <p style="text-align:center;color:var(--mut);font-size:.9rem;margin-top:20px">
    New to DocSmartly? <a href="register.html" style="color:var(--ac);font-weight:700">Register free</a>
  </p>
</div>

<script>
const API = 'https://docsmartly-api.hm2351994.workers.dev';

async function hash(pw, salt) {
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: enc.encode(salt), iterations: 100000 }, key, 256);
  return [...new Uint8Array(bits)].map(b => b.toString(16).padStart(2, '0')).join('');
}

document.getElementById('fLog').onsubmit = async e => {
  e.preventDefault();
  const err = document.getElementById('err');
  err.hidden = true;
  const id = document.getElementById('lId').value.trim();
  const pw = document.getElementById('lPw').value;

  try {
    const saltRes = await fetch(API + '/api/salt/' + encodeURIComponent(id));
    if (!saltRes.ok) throw new Error('Account not found.');
    const { salt } = await saltRes.json();
    const pwHash = await hash(pw, salt);

    const logRes = await fetch(API + '/api/login', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ id, hash: pwHash })
    });
    if (!logRes.ok) throw new Error('Invalid mobile/email or password.');
    const j = await logRes.json();

    localStorage.setItem('ds_session', j.user.id);
    localStorage.setItem('ds_token', j.token);
    localStorage.setItem('ds_users', JSON.stringify([j.user]));

    window.location.replace('dashboard.html');
  } catch (ex) {
    err.textContent = ex.message || 'Login failed.';
    err.hidden = false;
  }
};

if (localStorage.getItem('ds_session') && localStorage.getItem('ds_token')) {
  window.location.replace('dashboard.html');
}
</script>
</body>
</html>
